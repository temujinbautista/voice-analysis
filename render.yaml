services:
  - type: web
    name: auto-ace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: AutoAce Voice Analysis
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PHP_CLI_SERVER_WORKERS
        value: "2"
      - key: FILESYSTEM_DISK
        value: local
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_TEMPERATURE
        value: "0.2"
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

services:
  - type: web
    name: auto-ace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: AutoAce Voice Analysis
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PHP_CLI_SERVER_WORKERS
        value: "2"
      - key: FILESYSTEM_DISK
        value: local
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_BASE
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_TEMPERATURE
        value: "0"
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Set to smtp to re-enable batch-complete notification emails — left on
      # log for now since a real SMTP send adds latency to the sync-queue
      # request path.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
